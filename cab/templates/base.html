<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e1f3fa"><title>{% block title %}Book a cab{% endblock %} · {{brand}}</title><link rel="stylesheet" href="/static/site.css"><link rel="stylesheet" href="/static/glass.css"><script defer src="/static/site.js"></script>{% block head %}{% endblock %}</head><body><header><nav><a class="brand" href="/"><i class="brand-mark" aria-hidden="true"></i>{{brand}}<small>CABS</small></a><div class="links"><a href="/#booking">Book a ride</a><a href="/#fleet">Our fleet</a></div><a class="outline" href="/track">Track booking</a></nav></header><main>{% for msg in get_flashed_messages() %}<p class="alert" role="alert">{{msg}}</p>{% endfor %}{% block body %}{% endblock %}</main><footer><b>{{brand}} Cabs</b><span>Bengaluru, Karnataka</span>{% if contact %}<a href="tel:{{contact}}">{{contact}}</a>{% endif %}</footer></body></html>
